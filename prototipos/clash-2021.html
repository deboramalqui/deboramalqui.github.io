<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Clash · el onboarding de 2021</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&display=swap">
<style>:root{--accent:#e8112d;--on-accent:#ffffff}</style>
<style>
:root{--font:'Montserrat',-apple-system,"Segoe UI",Roboto,sans-serif;--red:#e8112d;--org:#f68b1f}
.device{width:393px;height:830px;padding:9px;background:#1b1a17;border-radius:51px;box-shadow:inset 0 0 0 2px #3a3833,0 24px 38px 3px rgba(0,0,0,.35),0 9px 46px 8px rgba(0,0,0,.2);transform:scale(var(--s,1));transform-origin:0 0}
.screen{position:relative;width:375px;height:812px;border-radius:42px;overflow:hidden;background:#fff;color:#1d1d1f;font-family:var(--font);-webkit-font-smoothing:antialiased}
.pscr{position:absolute;inset:0;display:flex;flex-direction:column;overflow:hidden}
.status{flex:none;height:44px;display:flex;align-items:center;justify-content:space-between;padding:10px 26px 0 30px;font:600 15px/20px var(--font);color:#fff}
.status svg{width:62px;height:12px;fill:currentColor;color:inherit}
.status--dark{color:#1d1d1f}
.homebar{position:absolute;left:50%;bottom:8px;width:134px;height:5px;margin-left:-67px;border-radius:3px;background:currentColor;opacity:.9;pointer-events:none}
.btn{all:unset;box-sizing:border-box;display:flex;align-items:center;justify-content:center;height:54px;border-radius:27px;font:600 15px/20px var(--font);letter-spacing:.4px;cursor:pointer;text-align:center;transition:transform .12s,background .2s}
.btn:active{transform:scale(.98)}
.btn:focus-visible{outline:2px solid currentColor;outline-offset:3px}
.btn--white{background:#fff;color:#1d1d1f;box-shadow:0 6px 16px rgba(0,0,0,.18)}
.btn--red{background:var(--red);color:#fff;box-shadow:0 6px 16px rgba(232,17,45,.32)}
.btn--red[disabled]{background:#f2a1ab;box-shadow:none;cursor:default}
.link{all:unset;cursor:pointer;text-decoration:underline;text-underline-offset:3px;font-weight:600}
.link:focus-visible{outline:2px solid currentColor;outline-offset:2px}
/* 1 · bienvenida */
.s1{background:linear-gradient(180deg,#e8112d 0%,#ef3a2e 48%,#f68b1f 100%);color:#fff;text-align:center}
.s1 .logo{width:156px;height:61px;margin:92px auto 0;display:block;fill:#fff}
.s1 h1{margin:40px 30px 0;font:700 20px/28px var(--font)}
.s1 p{margin:12px 38px 0;font:500 14px/22px var(--font);opacity:.95}
.s1 .cta{margin:auto 28px 0}
.s1 .more{margin:18px 0 0;font:500 13px/20px var(--font)}
.s1 .foot1{margin:auto 0 36px;font:500 13px/20px var(--font);opacity:.92}
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.4);opacity:0;pointer-events:none;transition:opacity .3s}
.scrim.is-on{opacity:1;pointer-events:auto}
.how{position:absolute;left:0;right:0;bottom:0;background:#fff;color:#1d1d1f;border-radius:28px 28px 0 0;padding:22px 24px 36px;text-align:left;box-shadow:0 -10px 40px rgba(0,0,0,.25);transform:translateY(105%);transition:transform .35s ease}
.how.is-on{transform:none}
.how h2{margin:0 0 4px;font:700 18px/24px var(--font)}
.how .sub{margin:0 0 14px;font:500 13px/19px var(--font);color:#6e6e73}
.how ol{margin:0 0 20px;padding:0;list-style:none;display:grid;gap:12px}
.how li{display:grid;grid-template-columns:30px 1fr;gap:12px;align-items:start;font:500 14px/21px var(--font)}
.how .btn{width:100%}
.how li b{width:30px;height:30px;border-radius:50%;background:var(--red);color:#fff;display:flex;align-items:center;justify-content:center;font:700 13px/1 var(--font)}
/* 2 y 3 · pasos */
.stepbar{flex:none;padding:8px 24px 0;font:600 11px/16px var(--font);letter-spacing:.6px;text-transform:uppercase;color:#8a8a8e;display:flex;justify-content:space-between;align-items:center}
.prog{display:flex;gap:4px;width:64px}.prog i{flex:1;height:4px;border-radius:2px;background:#e9e9ec}.prog i.on{background:var(--red)}
.s2 h2,.s3 h2{margin:16px 24px 0;font:700 20px/26px var(--font)}
.sub2{margin:6px 24px 0;font:500 12.5px/18px var(--font);color:#6e6e73}
.search{margin:14px 24px 0;height:40px;border-radius:20px;background:#f2f2f4;display:flex;align-items:center;gap:8px;padding:0 14px;flex:none}
.search svg{width:16px;height:16px;flex:none;stroke:#8a8a8e;fill:none;stroke-width:2.2;stroke-linecap:round}
.search input{all:unset;flex:1;font:500 13.5px/20px var(--font);color:#1d1d1f;min-width:0}
.search input::placeholder{color:#9a9aa0}
.list{flex:1;overflow:auto;padding:6px 24px 120px;overscroll-behavior:contain;scrollbar-width:none}
.list::-webkit-scrollbar{display:none}
.grp{margin-top:16px}
.grp h3{margin:0 0 8px;font:700 13.5px/18px var(--font)}
.tiles{display:flex;flex-wrap:wrap;gap:9px}
.tile{all:unset;box-sizing:border-box;position:relative;width:75px;height:56px;border-radius:10px;background:var(--b,#444);color:#fff;display:flex;align-items:center;justify-content:center;text-align:center;padding:6px;font:700 11px/13px var(--font);cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.18);transition:transform .15s,box-shadow .15s}
.tile:active{transform:scale(.95)}
.tile:focus-visible{outline:2px solid var(--red);outline-offset:2px}
.tile[aria-pressed=true]{box-shadow:0 0 0 2.5px #fff,0 0 0 4.5px var(--red)}
.tile .chk{position:absolute;right:-7px;top:-7px;width:20px;height:20px;border-radius:50%;background:var(--red);display:none;align-items:center;justify-content:center;box-shadow:0 0 0 2px #fff}
.tile .chk svg{width:12px;height:12px;stroke:#fff;fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.tile[aria-pressed=true] .chk{display:flex}
.tile--ask{background:#fff;color:#1d1d1f;border:1.5px dashed #c7c7cc;box-shadow:none;font-weight:600;font-size:10px;line-height:12px}
.tile--ask[aria-pressed=true]{border-style:solid;border-color:var(--red);box-shadow:none;color:var(--red)}
.tile[hidden]{display:none}
.foot{position:absolute;left:0;right:0;bottom:0;padding:12px 24px 32px;background:linear-gradient(rgba(255,255,255,0),#fff 35%);display:flex;align-items:center;justify-content:space-between;gap:12px}
.count{font:600 13px/18px var(--font);color:#6e6e73}
.count b{color:var(--red)}
.foot .btn{height:46px;padding:0 22px;border-radius:23px;font-size:14px;flex:none}
.chips{display:flex;flex-direction:column;align-items:center;gap:12px;padding:28px 24px}
.chip{all:unset;box-sizing:border-box;display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 16px;border-radius:20px;border:1.5px solid #d6d6db;font:600 11.5px/16px var(--font);letter-spacing:.4px;text-transform:uppercase;cursor:pointer;color:#1d1d1f;background:#fff;transition:background .15s,color .15s}
.chip svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.chip[aria-pressed=true]{background:var(--red);border-color:var(--red);color:#fff}
.chip:focus-visible{outline:2px solid var(--red);outline-offset:2px}
/* 4 · espera */
.s4{align-items:center;justify-content:center;text-align:center;padding:0 40px}
.ring{width:112px;height:112px;border-radius:50%;border:8px solid #e9e9ec;border-top-color:var(--red);animation:spin 1s linear infinite;display:flex;align-items:center;justify-content:center}
.ring svg{display:none;width:56px;height:56px;stroke:#fff;fill:none;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
.s4.is-done .ring{animation:none;border-color:#34c759;background:#34c759}
.s4.is-done .ring svg{display:block}
.s4 p{margin:28px 0 0;font:600 16px/24px var(--font)}
@keyframes spin{to{transform:rotate(360deg)}}
/* 5 · home */
.top{flex:none;height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;border-bottom:1px solid #ededf0}
.ib{all:unset;cursor:pointer;width:40px;height:40px;display:flex;align-items:center;justify-content:center;color:var(--red);border-radius:50%}
.ib:focus-visible{outline:2px solid var(--red)}
.ib svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round}
.top .logo{width:84px;height:33px;fill:var(--red)}
.hsearch{position:absolute;left:0;right:0;top:100px;padding:8px 16px 10px;background:#fff;display:none;z-index:3;border-bottom:1px solid #ededf0}
.hsearch.is-on{display:block}
.hsearch .search{margin:0}
.hbody{flex:1;overflow:auto;padding:0 0 100px;scrollbar-width:none}
.hbody::-webkit-scrollbar{display:none}
.sec{display:flex;justify-content:space-between;align-items:baseline;padding:18px 20px 10px}
.sec h2{margin:0;font:700 15px/20px var(--font)}
.sec .link{font:600 12.5px/18px var(--font);color:var(--red);text-decoration:none}
.memb{display:flex;gap:10px;padding:2px 20px 6px;overflow:auto;scrollbar-width:none}
.memb::-webkit-scrollbar{display:none}
.memb .tile{flex:none;cursor:default}
.memb .tile--add{background:#fff;color:var(--red);border:1.5px solid var(--red);box-shadow:none;font:400 26px/1 var(--font);cursor:pointer}
.cards{display:flex;gap:12px;padding:2px 20px 8px;overflow:auto;scrollbar-width:none}
.cards::-webkit-scrollbar{display:none}
.card{flex:none;width:150px;border-radius:18px;background:#f5f5f7;padding:14px 12px 14px;text-align:center}
.card .t{font:700 13px/17px var(--font)}.card .t small{display:block;font:500 11px/15px var(--font);color:#6e6e73}
.card .pct{margin:10px auto 0;width:84px;height:84px;border-radius:50%;background:radial-gradient(circle at 50% 75%,#ffd166 0,#ff7a1a 55%,#e8112d 100%);color:#fff;display:flex;align-items:center;justify-content:center;font:800 22px/1 var(--font);box-shadow:0 6px 14px rgba(232,17,45,.3)}
.card .n{margin:12px 0 0;font:600 12px/16px var(--font)}.card .n small{display:block;font:500 10.5px/14px var(--font);color:#6e6e73}
.hfoot .btn{width:100%}
.soon{list-style:none;margin:0;padding:0 20px}.soon li{display:grid;grid-template-columns:36px 1fr auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid #ededf0;font:600 12.5px/17px var(--font)}.soon li small{display:block;font:500 11px/15px var(--font);color:#6e6e73}.soon i{width:36px;height:36px;border-radius:10px;background:var(--b)}.soon b{font:800 13px/1 var(--font);color:var(--red)}
.hfoot{position:absolute;left:0;right:0;bottom:0;padding:12px 24px 32px;background:linear-gradient(rgba(255,255,255,0),#fff 40%)}
.toast{position:absolute;left:20px;right:20px;bottom:104px;background:#1d1d1f;color:#fff;border-radius:12px;padding:12px 14px;font:500 13px/18px var(--font);opacity:0;transform:translateY(8px);transition:.25s;pointer-events:none;z-index:4}
.toast.is-on{opacity:1;transform:none}
/* 2021 · capturas con zonas activas */
.shot{position:absolute;inset:0;width:375px;height:812px;object-fit:cover;display:block}
.hs{all:unset;position:absolute;cursor:pointer;border-radius:14px;transition:box-shadow .2s}
.hs:hover,.hs:focus-visible{box-shadow:inset 0 0 0 2px rgba(255,255,255,.75),0 0 0 2px rgba(232,17,45,.5)}
.hs.is-hl{box-shadow:0 0 0 3px #fff,0 0 0 7px rgba(232,17,45,.65)}
</style>
<style>
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:transparent;color-scheme:dark}
body{font-family:var(--font);color:#e8ecf4;-webkit-font-smoothing:antialiased}
.px{display:grid;grid-template-columns:minmax(0,auto) minmax(260px,1fr);gap:40px;align-items:start;justify-content:center;padding:20px 12px 28px;max-width:960px;margin:0 auto}
.px__stage{display:flex;justify-content:center;position:relative}
.px__ptr{position:absolute;left:0;top:0;width:30px;height:30px;margin:-15px 0 0 -15px;border-radius:50%;background:rgba(255,255,255,.28);border:2px solid #fff;box-shadow:0 2px 12px rgba(0,0,0,.5);pointer-events:none;z-index:60;opacity:0;transition:left .6s cubic-bezier(.4,0,.2,1),top .6s cubic-bezier(.4,0,.2,1),opacity .2s}
.px__ptr.is-on{opacity:1}
.px__ptr::after{content:"";position:absolute;inset:-2px;border-radius:50%;border:2px solid #fff;opacity:0}
.px__ptr.is-tap{transform:scale(.8);transition:left .6s cubic-bezier(.4,0,.2,1),top .6s cubic-bezier(.4,0,.2,1),opacity .2s,transform .12s}
.px__ptr.is-tap::after{animation:pxring .4s ease-out}
@keyframes pxring{from{opacity:.9;transform:scale(1)}to{opacity:0;transform:scale(2.2)}}
.px__scale{width:calc(var(--w) * var(--s,1));height:calc(var(--h) * var(--s,1))}
.px__scale>.phone,.px__scale>.desk{transform:scale(var(--s,1));transform-origin:0 0}
.px--wide{grid-template-columns:1fr;max-width:1304px;gap:24px}
.px--wide .px__panel{display:grid;grid-template-columns:minmax(220px,1fr) 2fr;gap:12px 32px;align-items:start}
.px--wide .px__title{grid-column:1/-1}
.px--wide .px__steps{grid-row:span 3}
.px--wide .px__what{min-height:44px}
.px__panel{display:flex;flex-direction:column;gap:16px;min-width:0}
.px__title{font:500 11px/16px var(--font);letter-spacing:1.6px;text-transform:uppercase;color:#9fb0c8;margin:0}
.px__steps{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.px__steps button{all:unset;box-sizing:border-box;display:flex;gap:12px;align-items:center;width:100%;padding:10px 12px;cursor:pointer;border-left:3px solid transparent;color:#aab6c8;font:400 14px/20px var(--font);letter-spacing:.25px}
.px__steps button:hover{background:rgba(255,255,255,.05)}
.px__steps button:focus-visible{outline:2px solid #8fb8ff;outline-offset:-2px}
.px__steps button[aria-current=step]{color:#fff;border-left-color:var(--accent);background:rgba(255,255,255,.07)}
.px__steps b{font:500 12px/16px var(--font);width:22px;color:var(--accent)}
.px__what{font:400 14px/22px var(--font);letter-spacing:.2px;color:#cfd8e6;margin:0;min-height:66px}
.px__bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.px__btn{all:unset;box-sizing:border-box;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:0 16px;border:1px solid rgba(255,255,255,.28);color:#fff;font:500 13px/16px var(--font);letter-spacing:1px;text-transform:uppercase;cursor:pointer;border-radius:2px}
.px__btn:hover{background:rgba(255,255,255,.08)}
.px__btn:focus-visible{outline:2px solid #8fb8ff;outline-offset:2px}
.px__btn--main{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.px__btn--main:hover{filter:brightness(1.08);background:var(--accent)}
.px__hint{font:400 12px/18px var(--font);color:#8d9bb0;margin:0}
.px__live{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media(max-width:760px){.px{grid-template-columns:1fr;gap:20px}.px__stage{justify-content:center}.px--wide .px__panel{grid-template-columns:1fr}.px--wide .px__steps{grid-row:auto}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head><body>

<script>
(function(){
  var $=function(s,r){return (r||document).querySelector(s)},$$=function(s,r){return [].slice.call((r||document).querySelectorAll(s))};
  var tt=0;function toast(m){var t=$('#toast');t.textContent=m;t.classList.add('is-on');clearTimeout(tt);tt=setTimeout(function(){t.classList.remove('is-on')},2200)}
  function userClick(e){if(e.isTrusted&&window.PROTO.isAuto())window.PROTO.stopAuto();return e.isTrusted}
  document.addEventListener('click',function(e){var b=e.target.closest('[data-hs]');if(!b)return;userClick(e);var a=b.getAttribute('data-hs');
    if(a==='next')window.PROTO.next();else if(a==='jump3')window.PROTO.go(3);else if(a==='reset'){window.PROTO.go(0)}
    else if(a==='login')toast('Ingresar: para quien ya tiene cuenta. Seguimos por el registro.');
    else if(a==='code')toast('El código llega por correo: hay que salir de la app para buscarlo.');
    else if(a==='toast')toast('Recién acá la app pide los bancos y las prepagas, uno por uno.')});
  function unhl(){$$('.hs.is-hl').forEach(function(h){h.classList.remove('is-hl')})}
  function hl(i,sel){var s=$$('.pscr')[i];var h=sel?$(sel,s):null;if(h)h.classList.add('is-hl')}
  window.PROTO_RESET=function(){unhl();$('#toast').classList.remove('is-on')};
  function step(name,what,sel,ms){return {name:name,what:what,enter:unhl,demo:async function(ok,wait){await wait(ms||1500);if(!ok())return;hl(window.PROTO.cur(),sel);await wait(900)}}}
